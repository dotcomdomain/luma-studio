<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Luma Studio</title><link rel="stylesheet" href="style.css"></head><body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="spark" viewBox="0 0 24 24"><path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6Z"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol><symbol id="sliders" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol><symbol id="crop" viewBox="0 0 24 24"><path d="M6 3v15h15M3 6h15v15"/></symbol><symbol id="text" viewBox="0 0 24 24"><path d="M4 7V4h16v3M12 4v16m-4 0h8"/></symbol><symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol><symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol><symbol id="film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/></symbol><symbol id="photo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol><symbol id="undo" viewBox="0 0 24 24"><path d="M8 5 3 10l5 5m-5-5h11a6 6 0 0 1 0 12"/></symbol><symbol id="redo" viewBox="0 0 24 24"><path d="m16 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12"/></symbol><symbol id="compare" viewBox="0 0 24 24"><path d="M12 3v18M9 5H4v14h5m6-14h5v14h-5"/></symbol><symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol><symbol id="sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Zm13-2a7 7 0 0 1 0 10m2-13a11 11 0 0 1 0 16"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="rotate" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0 0 6M20 3v7h-7"/></symbol><symbol id="flip" viewBox="0 0 24 24"><path d="M12 3v18M8 5 3 19h5Zm8 0 5 14h-5Z"/></symbol><symbol id="pen" viewBox="0 0 24 24"><path d="m16 3 5 5-12 12-6 1 1-6Z M14 5l5 5M4 15l5 5"/></symbol><symbol id="speed" viewBox="0 0 24 24"><path d="M4 18a9 9 0 1 1 16 0M12 13l5-6M5 10l2 1m10 0 2-1M12 4v2"/><circle cx="12" cy="13" r="1.5"/></symbol><symbol id="tools" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol><symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="flip-v" viewBox="0 0 24 24"><path d="M3 12h18M5 8 19 3v5Zm0 8 14 5v-5Z"/></symbol><symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol><symbol id="center" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></symbol><symbol id="reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 0 6M4 3v7h7"/></symbol></defs></svg>
<svg id="filterDefs" class="filter-defs" aria-hidden="true" width="0" height="0"></svg><div id="home" class="screen">
<header><div class="brand"><span class="brandmark"><svg viewBox="18 18 72 72" aria-hidden="true"><defs><radialGradient id="bmBg" cx="72%" cy="26%" r="90%"><stop offset="0" stop-color="#2b3c2d"/><stop offset=".5" stop-color="#162019"/><stop offset="1" stop-color="#0c110e"/></radialGradient><radialGradient id="bmSun" cx="36%" cy="32%" r="78%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#f1fbd6"/><stop offset="1" stop-color="#bfe082"/></radialGradient><radialGradient id="bmGlow"><stop offset="0" stop-color="#e4f6bd" stop-opacity=".55"/><stop offset=".5" stop-color="#d8f0a6" stop-opacity=".14"/><stop offset="1" stop-color="#d8f0a6" stop-opacity="0"/></radialGradient><linearGradient id="bmInk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef9d4"/><stop offset="1" stop-color="#bcdc85"/></linearGradient></defs><rect width="108" height="108" fill="url(#bmBg)"/><g transform="translate(54 54) scale(.8) translate(-54 -54)"><circle cx="62" cy="46" r="28" fill="url(#bmGlow)"/><path d="M33 33V75H75" fill="none" stroke="url(#bmInk)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62" cy="46" r="13" fill="url(#bmSun)"/></g></svg></span><span>Luma</span></div></header>
<main class="home-main">
<section class="home-hero">
<h1 class="home-title">Edit a photo<br>or video</h1>
<button class="primary open-button" onclick="Native.pick()"><svg><use href="#plus"/></svg>Open media</button>
<div id="resumeSection" class="home-recent hidden"><h2 class="home-label">Recent</h2>
<div id="recentList" class="recent-list"></div></div>
</section>
<section class="home-samples"><h2 class="home-label">Try a sample</h2><div class="sample-row"><button class="sample-pill" onclick="demoPhoto()"><img src="alpine.jpg" alt="">Photo</button><button class="sample-pill sample-video" onclick="Native.demoVideo()"><img src="alpine.jpg" alt="">Video</button></div></section>
</main></div>
<div id="editor" class="screen hidden"><header class="editor-header"><button class="icon-btn" aria-label="Back to studio" onclick="goBack()"><svg><use href="#back"/></svg></button><div class="project-title"><strong id="projectName">Alpine escape</strong></div><button id="saveFrameButton" class="icon-btn frame-photo-btn hidden" aria-label="Save this frame as a photo" title="Save this frame as a photo" onclick="saveFrame()"><svg><use href="#photo"/></svg></button><button class="primary export-btn" onclick="openExport()">Export <svg><use href="#arrow"/></svg></button></header>
<div class="workspace"><div class="preview-wrap"><div id="preview" class="preview"><canvas id="canvas"></canvas><video id="video" playsinline loop class="hidden"></video><div id="gestureLayer" class="gesture-layer" aria-label="Edit media directly"><div id="cropOverlay" class="crop-overlay hidden"><i data-handle="nw"></i><i data-handle="n"></i><i data-handle="ne"></i><i data-handle="e"></i><i data-handle="se"></i><i data-handle="s"></i><i data-handle="sw"></i><i data-handle="w"></i></div><div id="textSelection" class="text-selection hidden"></div></div></div><span id="playFlash" class="play-flash" aria-hidden="true"><svg><use href="#play"/></svg></span></div>
<div class="edit-actions"><div><button class="icon-btn" id="undoButton" aria-label="Undo edit" onclick="undo()"><svg><use href="#undo"/></svg></button><button class="icon-btn" id="redoButton" aria-label="Redo edit" onclick="redo()"><svg><use href="#redo"/></svg></button></div><button id="compareButton" class="compare" aria-label="Show original" aria-pressed="false"><svg><use href="#compare"/></svg> Hold original</button><button class="reset" onclick="resetEdit()" aria-label="Reset all edits">Reset all</button></div>
<div id="timeline" class="timeline hidden"><button class="icon-btn" id="playButton" aria-label="Play" onclick="togglePlay()"><svg><use href="#play"/></svg></button><div id="playheadTrack" class="playhead-track"><div class="progress-ruler" aria-hidden="true"><i style="left:0.0%" class="major"></i><i style="left:6.25%"></i><i style="left:12.5%"></i><i style="left:18.75%"></i><i style="left:25.0%" class="major"></i><i style="left:31.25%"></i><i style="left:37.5%"></i><i style="left:43.75%"></i><i style="left:50.0%" class="major"></i><i style="left:56.25%"></i><i style="left:62.5%"></i><i style="left:68.75%"></i><i style="left:75.0%" class="major"></i><i style="left:81.25%"></i><i style="left:87.5%"></i><i style="left:93.75%"></i><i style="left:100.0%" class="major"></i></div><span class="outside-trim before"></span><span class="outside-trim after"></span><input type="range" id="scrub" min="0" max="100" step="0.01" value="0" aria-label="Video playhead" oninput="scrubTo(+this.value)"></div><span class="play-time"><span id="playTime">0:00.00</span><span id="playTotal"></span></span></div>
</div><section class="tool-area"><div id="toolContent"></div></section>
<div class="tool-navigation"><nav class="tool-nav"><button data-tool="looks" onclick="setTool('looks')"><svg><use href="#spark"/></svg>Looks</button><button data-tool="adjust" onclick="setTool('adjust')"><svg><use href="#sliders"/></svg>Adjust</button><button data-tool="crop" onclick="setTool('crop')"><svg><use href="#crop"/></svg>Frame</button><button data-tool="text" id="textTool" onclick="setTool('text')"><svg><use href="#text"/></svg>Text</button><button data-tool="draw" onclick="setTool('draw')"><svg><use href="#pen"/></svg>Draw</button><button data-tool="trim" id="trimTool" class="hidden" onclick="setTool('trim')"><svg><use href="#film"/></svg>Trim</button><button data-tool="playback" id="playbackTool" class="hidden" onclick="setTool('playback')"><svg><use href="#speed"/></svg>Playback</button></nav></div></div>
<div class="modal-backdrop hidden" id="exportModal"><div class="sheet export-sheet" role="dialog" aria-modal="true" aria-labelledby="exportTitle"><div class="sheet-top"><div class="sheet-handle"></div><h2 id="exportTitle" tabindex="-1">Export</h2><button class="icon-btn sheet-close" aria-label="Close export" onclick="closeExport()"><svg><use href="#close"/></svg></button></div><div id="exportOptions"></div><div class="sheet-bottom"><div class="export-summary" id="exportSummary"></div><button class="primary save-button" id="saveButton" onclick="doExport()"><svg><use href="#download"/></svg>Save to gallery</button><button id="shareButton" class="secondary hidden" onclick="Native.share()">Share <svg><use href="#arrow"/></svg></button><button id="cancelExport" class="reset hidden" onclick="cancelExport()">Cancel export</button><p id="exportStatus" class="status-note" role="status" aria-live="polite"></p></div></div></div><div id="colorModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="colorTitle"><div class="sheet color-sheet"><div class="sheet-handle"></div><div class="color-heading"><h2 id="colorTitle">Color</h2><span id="colorPreview" aria-hidden="true"></span></div><div id="colorSurface" class="color-surface" role="slider" tabindex="0" aria-label="Color saturation and brightness" aria-valuemin="0" aria-valuemax="100"><span id="colorCursor" class="color-cursor"></span></div><input id="colorHue" class="color-hue" type="range" min="0" max="359.99" step=".1" aria-label="Hue" oninput="colorHueInput(this.value)"><div id="colorPresets" class="color-presets" aria-label="Color presets"></div><div class="color-hex-row"><label for="colorHex">Hex</label><input id="colorHex" class="field" type="text" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Hex color" oninput="colorHexInput(this.value)"></div><div class="color-actions"><button class="secondary" onclick="closeColorPicker(false)">Cancel</button><button id="colorDone" class="primary" onclick="closeColorPicker(true)">Done</button></div></div></div><div id="exportDropdownLayer" class="export-dropdown-layer hidden"><div id="exportDropdownMenu" class="export-dropdown-menu" role="listbox" tabindex="-1"></div></div><div id="timingPrecision" class="timing-precision hidden" aria-live="polite"></div><div id="busy" class="busy hidden" role="status" aria-live="polite"><div class="busy-card"><span class="spinner" aria-hidden="true"></span><span id="busyText">Opening…</span></div></div><div id="toast" role="status"></div><script src="app.js"></script><script src="editing.js"></script><script src="timing.js"></script><script src="navigation.js"></script><script src="color-picker.js"></script><script src="photo-analysis.js"></script><script src="export-config.js"></script></body></html>
